[PATHS]
# Path where the input file is located
InputDirectory = ~/texte/Bibel/Publikationen/L2EDevelopment/BuZ
# The file to process
InputFile = BuZ.tex
# Path where any output is going to. Default: <InputDirectory>/L2E
#OutputDirectory = /somewhere/else

# Additional files
# Used to get information about short and long names of versions
Translations = ~/texmf/tex/latex/mhs/bibel/übersetzungen.tex
# Personal settings
PersonalSettings = ~/texmf/tex/latex/mhs/mhsdefault.tex

#     ██████  ███████ ███    ██ ███████ ██████   █████  ██
#    ██       ██      ████   ██ ██      ██   ██ ██   ██ ██
#    ██   ███ █████   ██ ██  ██ █████   ██████  ███████ ██
#    ██    ██ ██      ██  ██ ██ ██      ██   ██ ██   ██ ██
#     ██████  ███████ ██   ████ ███████ ██   ██ ██   ██ ███████
#
#
[GENERAL]
# Language to extract (if there are more than one). Default: DE
# For a quick change, use --language=EN on the command line instead of changing this file.
#Language = EN

# Target format: epub | html
Target = html

#    ███████ ██████   ██████   ██████  ██   ██
#    ██      ██   ██ ██    ██ ██    ██ ██  ██
#    █████   ██████  ██    ██ ██    ██ █████
#    ██      ██   ██ ██    ██ ██    ██ ██  ██
#    ███████ ██████   ██████   ██████  ██   ██
#
#
[EBOOK]

# German "ß" character. Default: "normal", also valid: "aggressive", "radical"
#
#  ┌────────────┬─────────┬───────────────┐
#  │   SZMode   │ {\sz} → │ {\szquoted} → │
#  ├────────────┼─────────┼───────────────┤
#  │ normal     │ ß       │ ß             │
#  ├────────────┼─────────┼───────────────┤
#  │ aggressive │ ss      │ ß             │
#  ├────────────┼─────────┼───────────────┤
#  │ radical    │ ss      │ ss            │
#  └────────────┴─────────┴───────────────┘

#SZMode = aggressive

# The name of God. Default: Jahwe, also valid: JHWH, HERR, hebrew
#YHWH = Jahwe
#YHWH = JHWH
#YHWH = HERR
#YHWH = hebrew

# Verse emphasis style. Default: "font-weight: bold;"
#VerseEmphasis = "font-style: italic;"

# Transliteration style. Default: "font-style: italic;"
#Transliteration = "font-weight: bold;"

# Size of the Hebrew font; default: 1.2em
#HebrewFontSize = 1.7em

# Size of the Greek font; default: 1.05em
#GreekFontSize = 1.2em

# Long version name; default: "font-style: italic;"
#LongVersionName = "font-weight: bold;"

# Person name format (\personenname{N}); default: "text-transform: uppercase; font-size: 85%;"
# Großbuchstaben behalten die normale Schriftgröße (kein Span); Kleinbuchstabenläufe werden in
# <span class="personname"> gewrappt und mit dieser CSS-Regel dargestellt.
# However, this seems not to work precisely - the smaller letter jump from "too small" to "too big".
# The default of 85% looks acceptable.
#PersonNameFormat = "text-transform: uppercase; font-size: 70%;"

