#    ██      ██   ██ ██    ██ ██    ██ ██  ██
#    █████   ██████  ██    ██ ██    ██ █████
#    ██      ██   ██ ██    ██ ██    ██ ██  ██
#    ███████ ██████   ██████   ██████  ██   ██
#
#
[EBOOK]

######################################################################
# SZMode
#
# German "ß" character.
# Default: "normal", the old-fashioned way - write "ß" whereever you want
# Also valid:
# - aggressive, "ß" only in quotations
# - radical, no "ß" at all; for editors who want to eliminate "ß" alltogether
#
#  ┌────────────┬─────────┬───────────────┐
#  │   SZMode   │ {\sz} → │ {\szquoted} → │
#  ├────────────┼─────────┼───────────────┤
#  │ normal     │ ß       │ ß             │
#  ├────────────┼─────────┼───────────────┤
#  │ aggressive │ ss      │ ß             │
#  ├────────────┼─────────┼───────────────┤
#  │ radical    │ ss      │ ss            │
#  └────────────┴─────────┴───────────────┘
#SZMode = aggressive
######################################################################

######################################################################
# YHWH
#
# How to render the Tetragrammaton
# Default: Jahwe, also valid: JHWH, HERR, hebrew
#YHWH = hebrew
######################################################################

######################################################################
# VerseEmphasis
#
# Determines how an emphasis in a quotation is rendered. Use a CSS
# expression.
# Default: "font-weight: bold;"
VerseEmphasis = "font-style: italic;"
######################################################################

######################################################################
# Transliteration
#
# Determines how the transliteration of a Hebrew or Greek word is
# rendered. Use a CSS expression
# Default: "font-style: italic;"
#Transliteration = "font-weight: bold;"
######################################################################

######################################################################
# HebrewFontSize
#
# Hebrew is too small compared to latin characters. This is the factor
# used to enlarge the Hebrew font.
# Default: 1.2em
#HebrewFontSize = 1.7em
######################################################################

######################################################################
# GreekFontSize
#
# Greek is a little too small compared to latin characters. This is
# the factor used to enlarge the Greek font.
# Default: 1.05em
#GreekFontSize = 1.2em
######################################################################

######################################################################
# LongVersionName
#
# Determines how the full name of Bible versions are rendered. Use
# a CSS expression.
# Default: "font-style: italic;"
#LongVersionName = "font-weight: bold;"
######################################################################

######################################################################
# BibleRefStyle and BibleRefFormat
# Determine how the book names in Bible references are rendered.
#
# ┌─────────────┬─────────────────────────────────────────────────────────┐
# │ Order       │ Configured in                                           │
# ├─────────────┼─────────────────────────────────────────────────────────┤
# │ 1           │ \biblerefstyle{} / \biblerefformat{} in LaTeX Source    │
# ├─────────────┼─────────────────────────────────────────────────────────┤
# │ 2           │ INI (BibleRefStyle / BibleRefFormat)                    │
# ├─────────────┼─────────────────────────────────────────────────────────┤
# │ 3           │ CLI (--biblerefstyle / --biblerefformat)                │
# ├─────────────┼─────────────────────────────────────────────────────────┤
# │ Default     │ LThK / short (if none of the above are set)             │
# └─────────────┴─────────────────────────────────────────────────────────┘
#
######################################################################
# BibleRefStyle
#
# Default: LThK
# Also valid: Lutherbibel, Einheitsuebersetzung, jerusalem
#BibleRefStyle = Lutherbibel
######################################################################

######################################################################
# BibleRefFormat
#
# Determines whether the short or long book name in a Bible references
# is used.
# Default: short
# Also valid: long
#BibleRefFormat = lang
######################################################################

######################################################################
# PersonNameFormat
#
# Use a CSS expression.
# Default: "text-transform: uppercase; font-size: 85%;".
# The numeric value applies to the lower-case characters, the upper-
# case characters are not shrunk.
# However, this seems not to work properly - the lower-case characters
# jump from "too small" to "too big".
# The default of 85% looks acceptable.
#
#PersonNameFormat = "text-transform: uppercase; font-size: 70%;"
######################################################################

######################################################################
# SmallCaps
#
# Rendering of \textsc{} (small capitals).
# Use a CSS expression.
# Default: "text-transform: uppercase; font-size: 85%;"
#
#SmallCaps = "font-variant: small-caps; font-size: 50%;"
######################################################################

######################################################################
# Heading Numbering
#
# Numbering style for each heading level.
# Valid values: arabic | roman_upper | roman_lower | alpha_upper | alpha_lower | none
#
# Default:
#   \part              → roman_upper  (I, II, III …)
#   \chapter and below → arabic       (1, 2, 3 …)
#   \appendix chapters → alpha_upper  (A, B, C …)
#
#NumberingPart          = roman_upper
#NumberingChapter       = arabic
#NumberingSection       = arabic
#NumberingSubsection    = arabic
#NumberingSubsubsection = arabic
#NumberingAppendices    = alpha_upper
######################################################################







