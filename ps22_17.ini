[PATHS]
# Path where the input file is located
InputDirectory = /home/mhs/texte/Bibel/Publikationen/Textkritik
# The file to process
InputFile = Ps22.17.tex
# Path where any output is going to. Default: <InputDirectory>/L2E
#OutputDirectory = /somewhere/else

[GENERAL]
# Language to extract (if there are more than one). Default: DE
# For a quick change, use --language=EN on the command line instead of changing this file.
#Language = EN

# Target format: epub | html
Target = html

[EBOOK]
# German "ß" character. Default: ß
#sz = "ss"
# in quotations. Default: ß; should never be changed
#szquoted = ss

# Verse emphasis style. Default: "font-weight: bold;"
#VerseEmphasis = "font-style: italic;"

# Transliteration style. Default: "font-style: italic;"
#Transliteration = "font-weight: bold;"

# Size of the Hebrew font; default: 1.2em
#HebrewFontSize = 1.7em

# Size of the Greek font; default: 1.05em
#GreekFontSize = 1.2em

# Long version name; default: "font-style: italic;"
#LongVersionName = "font-weight: bold;"

[LANG_DE]
Title       = Von Strichen, Löwen, Händen und Füßen
Subtitle    = Eine textkritische Untersuchung zu Psalm 22,17
Author      = Martin Schweikert
Year        = 2026
Description = Von Strichen, Löwen, Händen und Füßen – Eine textkritische Untersuchung zu Psalm 22,17
Keywords    = Bibel, Psalm 22, Textkritik, Hebräisch, Septuaginta, LXX, Masoretischer Text, MT, Textüberlieferung

[LANG_EN]
Title       = Of Strokes, Lions, Hands and Feet
Subtitle    = A Text-Critical Study on Psalm 22:17
Author      = Martin Schweikert
Year        = 2026
Description = Of Strokes, Lions, Hands and Feet – A Text-Critical Study on Psalm 22:17
Keywords    = Bible, Psalm 22, textual criticism, Hebrew, Septuagint, LXX, Masoretic Text, MT, textual transmission

[LOGGING]
# Log level: DEBUG | INFO | WARNING | ERROR | CRITICAL
LogLevel = DEBUG
# Log file path. Leave empty to write to stdout only.
#LogFile = /home/mhs/texte/Bibel/Publikationen/Textkritik/L2E/tex2ebook.log
